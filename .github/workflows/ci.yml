name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (ml/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r ml/requirements.txt
      # No dataset in CI: the tests use synthetic matches and the committed
      # model files in ml/artifacts.
      - name: Run tests
        run: python -m pytest ml/tests -q

  api:
    name: API build and tests (api/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
        env:
          # The CPU runtime is bundled; skip the optional GPU (CUDA) download.
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Build
        run: npm run build
      # Reads the model from ../ml/artifacts, which is committed.
      - name: Run tests
        run: npm test
