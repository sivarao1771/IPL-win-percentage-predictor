<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Win Probability Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <!-- 3D Background Canvas -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- Gradient Overlay for better readability -->
    <div class="gradient-overlay"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Header Section -->
        <div class="header-section">
            <div class="logo-container">
                <div class="cricket-icon">🏏</div>
                <h1 class="main-title">IPL Win Predictor</h1>
            </div>
            <p class="subtitle">Advanced Machine Learning Predictions</p>
            <div class="stats-badges">
                <span class="badge">Random Forest</span>
                <span class="badge">Neural Network</span>
                <span class="badge">Logistic Regression</span>
            </div>
        </div>

        <!-- Prediction Form -->
        <div class="prediction-form">
            <div class="form-grid">
                <!-- Team Selection Row -->
                <div class="form-row">
                    <div class="input-group">
                        <label for="batting-team">Batting Team</label>
                        <select id="batting-team" class="team-select">
                            <option value="" disabled selected>Choose batting team</option>
                        </select>
                    </div>
                    <div class="vs-divider">VS</div>
                    <div class="input-group">
                        <label for="bowling-team">Bowling Team</label>
                        <select id="bowling-team" class="team-select">
                            <option value="" disabled selected>Choose bowling team</option>
                        </select>
                    </div>
                </div>

                <!-- Venue Selection -->
                <div class="form-row single">
                    <div class="input-group full-width">
                        <label for="city">Venue</label>
                        <select id="city" class="venue-select">
                            <option value="" disabled selected>Select match venue</option>
                        </select>
                    </div>
                </div>

                <!-- Match Statistics Grid -->
                <div class="stats-grid">
                    <div class="input-group">
                        <label for="target">Target Score</label>
                        <input type="number" id="target" placeholder="e.g., 180" min="1" max="300">
                    </div>
                    <div class="input-group">
                        <label for="score">Current Score</label>
                        <input type="number" id="score" placeholder="e.g., 120" min="0" max="300">
                    </div>
                    <div class="input-group">
                        <label for="overs">Overs Completed</label>
                        <input type="number" id="overs" placeholder="e.g., 15.3" step="0.1" min="0" max="20">
                    </div>
                    <div class="input-group">
                        <label for="wickets">Wickets Lost</label>
                        <input type="number" id="wickets" placeholder="e.g., 4" min="0" max="10">
                    </div>
                </div>

                <!-- Predict Button -->
                <button id="predict-btn" class="predict-button">
                    <span class="button-text">Calculate Win Probability</span>
                    <div class="button-glow"></div>
                </button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="result-container" class="result-container hidden">
            <!-- Main Result Display -->
            <div class="main-result">
                <h3 class="result-title">Match Prediction</h3>
                
                <!-- Team Labels -->
                <div class="team-labels">
                    <span id="batting-team-result" class="team-label batting"></span>
                    <span id="bowling-team-result" class="team-label bowling"></span>
                </div>

                <!-- Probability Bar -->
                <div class="probability-container">
                    <div class="probability-bar">
                        <div id="batting-probability" class="batting-prob">
                            <span id="batting-percentage" class="percentage"></span>
                        </div>
                        <div id="bowling-probability" class="bowling-prob">
                            <span id="bowling-percentage" class="percentage"></span>
                        </div>
                    </div>
                </div>

                <!-- Winner Declaration -->
                <div id="winner-declaration" class="winner-section">
                    <div class="winner-badge">
                        <span id="predicted-winner"></span>
                        <small>Predicted Winner</small>
                    </div>
                </div>
            </div>

            <!-- Model Breakdown -->
            <div class="model-breakdown">
                <h4 class="breakdown-title">Model Analysis</h4>
                <div class="model-grid">
                    <div class="model-item">
                        <div class="model-header">
                            <span class="model-name">Random Forest</span>
                            <span class="model-weight">45% Weight</span>
                        </div>
                        <div class="model-prediction" id="rf-prediction"></div>
                    </div>
                    <div class="model-item">
                        <div class="model-header">
                            <span class="model-name">Neural Network</span>
                            <span class="model-weight">45% Weight</span>
                        </div>
                        <div class="model-prediction" id="ann-prediction"></div>
                    </div>
                    <div class="model-item">
                        <div class="model-header">
                            <span class="model-name">Logistic Regression</span>
                            <span class="model-weight">10% Weight</span>
                        </div>
                        <div class="model-prediction" id="lr-prediction"></div>
                    </div>
                </div>
            </div>

            <!-- Error Message -->
            <div id="error-message" class="error-message"></div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-spinner">
            <div class="cricket-ball"></div>
            <p class="loading-text">Analyzing match data...</p>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="{{ url_for('static', filename='js/background3d.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
